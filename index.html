<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TP vs WNS | Executive Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f5f9;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 70%;
      height: 80%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 70%;
      height: 80%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .slides {
      flex: 1;
      width: 100%;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2vh 3vw;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      padding: 2.5vh 3vw;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .metric-header {
      display: flex;
      align-items: center;
      gap: 1.2vw;
      padding-left: 0.5vw;
    }
    .metric-header .icon-svg {
      width: 3.2vh;
      height: 3.2vh;
      color: #94a3b8;
    }
    .metric-header h2 {
      font-size: 4.2vh;
      font-weight: 600;
      color: #0b1a33;
      letter-spacing: -0.02em;
    }
    .metric-header .unit-badge {
      font-size: 2vh;
      font-weight: 500;
      color: #64748b;
      background: #e9edf2;
      padding: 0.2vh 1.2vw;
      border-radius: 40px;
      border: 1px solid #dce1e8;
    }

    .card-row {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      min-height: 0;
    }

    .centre-card {
      flex: 1;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 2.8vh;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 1.5vh 2.5vw;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .centre-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 0.6vh;
      border-radius: 0 6px 6px 0;
      background: var(--brand-colour);
    }
    .centre-card.tp { --brand-colour: #3b82f6; }
    .centre-card.wns { --brand-colour: #f59e0b; }

    .chart-area {
      flex: 0 0 28%;
      aspect-ratio: 1/1;
      max-height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chart-area canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .details-area {
      flex: 1;
      padding-left: 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5vh;
    }
    .details-area .centre-name {
      font-size: 2.6vh;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.2vh;
    }
    .details-area .centre-name .colour-dot {
      display: inline-block;
      width: 1.4vh;
      height: 1.4vh;
      border-radius: 50%;
      margin-right: 0.6vw;
      vertical-align: middle;
    }
    .details-area .main-value {
      font-size: 9vh;
      font-weight: 700;
      color: #0b1a33;
      letter-spacing: -0.03em;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 1vw;
    }
    .details-area .main-value .trend {
      font-size: 3.2vh;
      font-weight: 600;
      margin-left: 0.2vw;
    }
    .trend.up { color: #10b981; }
    .trend.down { color: #ef4444; }
    .trend.flat { color: #94a3b8; }

    .details-area .target-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 0.8vh;
      font-size: 2.2vh;
      color: #64748b;
    }
    .details-area .target-row .target-badge {
      display: flex;
      align-items: center;
      gap: 0.4vw;
      background: #f1f5f9;
      padding: 0.3vh 1.2vw;
      border-radius: 40px;
      border: 1px solid #e2e8f0;
    }
    .details-area .target-row .target-badge .t-icon {
      width: 1.8vh;
      height: 1.8vh;
      color: #94a3b8;
    }
    .details-area .target-row .target-badge strong {
      color: #0b1a33;
      font-weight: 600;
    }

    .remote {
      position: fixed;
      bottom: 2.5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2vw;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(16px);
      padding: 0.6vh 1.8vw;
      border-radius: 60px;
      z-index: 999;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 8px 32px rgba(0,0,0,0.06);
    }
    .remote button {
      background: none;
      border: none;
      color: #475569;
      font-size: 2.6vh;
      cursor: pointer;
      padding: 0.2vh 0.6vw;
      border-radius: 40px;
      transition: 0.2s;
      font-weight: 300;
      line-height: 1;
    }
    .remote button:hover {
      background: #f1f5f9;
      color: #0b1a33;
    }
    .remote .dot {
      color: #cbd5e1;
      font-size: 2vh;
      margin: 0 0.15vw;
      cursor: pointer;
      transition: 0.2s;
      line-height: 1;
    }
    .remote .dot.active-dot {
      color: #0b1a33;
      font-size: 2.8vh;
    }
    .remote .pause-btn { font-size: 2vh; padding: 0.2vh 0.6vw; }
    .remote .slide-counter {
      color: #94a3b8;
      font-size: 1.8vh;
      font-weight: 400;
      margin: 0 0.2vw;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .slide { padding: 1.5vh 2vw; gap: 1.5vh; }
      .centre-card { flex-direction: column; padding: 1.5vh; }
      .chart-area { flex: 0 0 40%; width: 40%; }
      .details-area { padding-left: 0; align-items: center; text-align: center; }
      .details-area .main-value { font-size: 5vh; flex-wrap: wrap; justify-content: center; }
      .metric-header h2 { font-size: 2.8vh; }
      .remote { padding: 0.4vh 3vw; gap: 2vw; }
    }
  </style>
</head>
<body>

<div class="slides" id="slidesContainer"></div>

<div class="remote" id="remoteControl">
  <button id="prevBtn" title="Previous">‹</button>
  <button id="pauseBtn" class="pause-btn" title="Pause/Play">⏸</button>
  <button id="nextBtn" title="Next">›</button>
  <span class="slide-counter" id="slideCounter">1 / 3</span>
  <span id="dotsContainer" style="display:flex;gap:0.2vw;align-items:center;"></span>
</div>

<script>
  (async function() {
    const SLIDE_INTERVAL = 15000;
    let currentSlide = 0;
    let slidesData = [];
    let intervalId = null;
    let isPaused = false;

    let data;
    try {
      const res = await fetch('data.json?t=' + Date.now());
      if (!res.ok) throw new Error('Network error');
      data = await res.json();
    } catch(e) {
      document.body.innerHTML = `<div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#b91c1c;font-size:2.5rem;background:#f2f5f9;">⚠️ Could not load data.json</div>`;
      return;
    }

    const targets = data.targets;
    const centres = data.centres;
    const metricKeys = ['SIS', 'IFSR', 'CHT'];
    const metricLabels = { SIS: 'SIS', IFSR: 'IFSR', CHT: 'CHT' };
    const metricUnits = { SIS: '%', IFSR: '%', CHT: 's' };
    const higherIsBetter = { SIS: true, IFSR: true, CHT: false };

    const svgIcons = {
      SIS: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><path d="M9 13l3 3 3-3"/></svg>`,
      IFSR: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M12 2v4"/><path d="M12 22v-4"/><path d="M2 12h4"/><path d="M22 12h-4"/></svg>`,
      CHT: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`
    };

    const container = document.getElementById('slidesContainer');
    const dotsContainer = document.getElementById('dotsContainer');
    const slideCounter = document.getElementById('slideCounter');

    metricKeys.forEach((metricKey, slideIndex) => {
      const slide = document.createElement('div');
      slide.className = 'slide' + (slideIndex === 0 ? ' active' : '');

      const header = document.createElement('div');
      header.className = 'metric-header';
      header.innerHTML = `
        ${svgIcons[metricKey]}
        <h2>${metricLabels[metricKey]}</h2>
        <span class="unit-badge">${metricUnits[metricKey]}</span>
      `;
      slide.appendChild(header);

      const cardRow = document.createElement('div');
      cardRow.className = 'card-row';

      centres.forEach((centre) => {
        const card = document.createElement('div');
        card.className = `centre-card ${centre.name.toLowerCase()}`;

        const chartArea = document.createElement('div');
        chartArea.className = 'chart-area';
        const canvas = document.createElement('canvas');
        canvas.id = `chart-${centre.name}-${metricKey}`;
        chartArea.appendChild(canvas);

        const details = document.createElement('div');
        details.className = 'details-area';
        const dotColour = centre.colour;
        details.innerHTML = `
          <div class="centre-name">
            <span class="colour-dot" style="background:${dotColour};"></span>
            ${centre.name}
          </div>
          <div class="main-value">
            <span id="val-${centre.name}-${metricKey}">—</span>
            <span class="trend" id="trend-${centre.name}-${metricKey}"></span>
          </div>
          <div class="target-row">
            <span class="target-badge">
              <svg class="t-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
              Target: <strong>${targets[metricKey]}${metricUnits[metricKey]}</strong>
            </span>
            <span style="font-size:1.8vh;color:#cbd5e1;">|</span>
            <span style="font-size:1.8vh;color:#94a3b8;">${metricKey === 'CHT' ? '↓ lower is better' : '↑ higher is better'}</span>
          </div>
        `;

        card.appendChild(chartArea);
        card.appendChild(details);
        cardRow.appendChild(card);

        slidesData.push({
          slideIndex,
          centreName: centre.name,
          colour: centre.colour,
          metricKey,
          canvas,
          target: targets[metricKey],
          current: centre.metrics[metricKey].current,
          previous: centre.metrics[metricKey].previous,
          higherIsBetter: higherIsBetter[metricKey],
          unit: metricUnits[metricKey],
          valueEl: document.getElementById(`val-${centre.name}-${metricKey}`),
          trendEl: document.getElementById(`trend-${centre.name}-${metricKey}`)
        });
      });

      slide.appendChild(cardRow);
      container.appendChild(slide);

      const dot = document.createElement('span');
      dot.className = 'dot' + (slideIndex === 0 ? ' active-dot' : '');
      dot.textContent = '●';
      dot.dataset.index = slideIndex;
      dot.style.cursor = 'pointer';
      dot.addEventListener('click', () => goToSlide(slideIndex));
      dotsContainer.appendChild(dot);
    });

    // --- Init Charts with centre text plugin ---
    const charts = [];
    slidesData.forEach((item) => {
      const ctx = item.canvas.getContext('2d');
      const current = item.current;
      const target = item.target;
      const isHigher = item.higherIsBetter;

      let met;
      if (isHigher) met = current >= target;
      else met = current <= target;

      let fillPercent;
      if (isHigher) {
        fillPercent = Math.min((current / target) * 100, 100);
      } else {
        if (current <= target) fillPercent = 100;
        else fillPercent = Math.min((target / current) * 100, 100);
      }

      const colour = met ? '#10b981' : '#f59e0b';

      // Custom plugin to display centre text
      const centreTextPlugin = {
        id: 'centreText',
        beforeDraw: function(chart) {
          const { width, height, ctx } = chart;
          ctx.save();
          const text = item.current + (item.unit === '%' ? '%' : '');
          const fontSize = Math.min(width, height) * 0.2;
          ctx.font = `700 ${fontSize}px Inter, -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#0b1a33';
          ctx.fillText(text, width / 2, height / 2);
          ctx.restore();
        }
      };

      const chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [fillPercent, 100 - fillPercent],
            backgroundColor: [colour, '#e9edf2'],
            borderWidth: 0,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '72%',
          plugins: {
            tooltip: { enabled: false },
            legend: { display: false }
          },
          animation: {
            animateRotate: true,
            duration: 800
          }
        },
        plugins: [centreTextPlugin]
      });
      charts.push(chart);
      item.chart = chart;

      // Update value & trend
      const displayVal = current + (item.unit === '%' ? '%' : '');
      if (item.valueEl) item.valueEl.textContent = displayVal;

      const prev = item.previous;
      const diff = current - prev;
      let trendText = '', trendClass = 'flat';
      if (Math.abs(diff) < 0.01) {
        trendText = '→ 0%';
      } else {
        const pctChange = (diff / Math.abs(prev)) * 100;
        const sign = diff > 0 ? '+' : '';
        trendText = `${sign}${pctChange.toFixed(1)}%`;
        if (isHigher) trendClass = diff > 0 ? 'up' : 'down';
        else trendClass = diff < 0 ? 'up' : 'down';
      }
      if (item.trendEl) {
        item.trendEl.textContent = trendText;
        item.trendEl.className = `trend ${trendClass}`;
      }
    });

    // --- Navigation ---
    function goToSlide(index) {
      if (index < 0) index = 0;
      if (index >= metricKeys.length) index = metricKeys.length - 1;
      currentSlide = index;
      document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === index));
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active-dot', i === index));
      slideCounter.textContent = `${index+1} / ${metricKeys.length}`;
    }

    function nextSlide() { goToSlide((currentSlide + 1) % metricKeys.length); }
    function prevSlide() { goToSlide((currentSlide - 1 + metricKeys.length) % metricKeys.length); }

    function startAutoPlay() {
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(nextSlide, SLIDE_INTERVAL);
      isPaused = false;
      document.getElementById('pauseBtn').textContent = '⏸';
    }
    function togglePause() {
      if (isPaused) { startAutoPlay(); }
      else { clearInterval(intervalId); intervalId = null; isPaused = true; document.getElementById('pauseBtn').textContent = '▶'; }
    }

    document.getElementById('nextBtn').addEventListener('click', () => { clearInterval(intervalId); nextSlide(); startAutoPlay(); });
    document.getElementById('prevBtn').addEventListener('click', () => { clearInterval(intervalId); prevSlide(); startAutoPlay(); });
    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); clearInterval(intervalId); nextSlide(); startAutoPlay(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); clearInterval(intervalId); prevSlide(); startAutoPlay(); }
      if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
    });

    goToSlide(0);
    startAutoPlay();
    window.addEventListener('resize', () => charts.forEach(ch => ch.resize()));
  })();
</script>
</body>
</html>
