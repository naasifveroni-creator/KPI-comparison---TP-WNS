<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta | TP vs WNS Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f2f5f9;
      --card-bg: rgba(255,255,255,0.85);
      --card-border: rgba(255,255,255,0.9);
      --text-primary: #0b1a33;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --badge-bg: #f1f5f9;
      --badge-border: #e2e8f0;
      --remote-bg: rgba(255,255,255,0.9);
      --shadow: 0 8px 32px rgba(0,0,0,0.04);
      --doughnut-bg: #e9edf2;
      --glow1: rgba(59, 130, 246, 0.04);
      --glow2: rgba(245, 158, 11, 0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: 16dvh;
    }
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 70%;
      height: 80%;
      background: radial-gradient(circle, var(--glow1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 70%;
      height: 80%;
      background: radial-gradient(circle, var(--glow2) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .brand-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 16dvh;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--badge-border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 0 2.5vw;
      z-index: 1000;
    }
    .brand-bar .brand-left {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .brand-bar .brand-left img {
      height: 100%;
      width: auto;
      object-fit: contain;
      max-height: 100%;
    }

    .slides {
      flex: 1;
      width: 100%;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1vh 3vw 2vh 3vw;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      padding: 1vh 3vw 2vh 3vw;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .metric-header {
      display: flex;
      align-items: center;
      gap: 1.2vw;
      padding-left: 0.5vw;
      flex-shrink: 0;
    }
    .metric-header .icon-svg {
      width: 3.2vh;
      height: 3.2vh;
      color: var(--text-muted);
    }
    .metric-header h2 {
      font-size: 4.2vh;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .metric-header .unit-badge {
      font-size: 2vh;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--badge-bg);
      padding: 0.2vh 1.2vw;
      border-radius: 40px;
      border: 1px solid var(--badge-border);
    }
    .metric-header .status-badge {
      font-size: 1.8vh;
      font-weight: 600;
      padding: 0.2vh 1vw;
      border-radius: 40px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text-secondary);
    }
    .metric-header .status-badge.on-target { color: #10b981; border-color: #10b981; }
    .metric-header .status-badge.below-target { color: #f59e0b; border-color: #f59e0b; }
    .metric-header .status-badge.well-below { color: #ef4444; border-color: #ef4444; }

    .metric-header .remote-inline {
      display: flex;
      align-items: center;
      gap: 0.6vw;
      margin-left: auto;
      background: var(--remote-bg);
      backdrop-filter: blur(8px);
      padding: 0.3vh 1vw;
      border-radius: 40px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .metric-header .remote-inline button {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 2.2vh;
      cursor: pointer;
      padding: 0.1vh 0.3vw;
      border-radius: 30px;
      transition: 0.2s;
      font-weight: 400;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .metric-header .remote-inline button:hover {
      background: var(--badge-bg);
      color: var(--text-primary);
    }
    .metric-header .remote-inline .pause-btn { font-size: 1.8vh; }
    .metric-header .remote-inline .dot {
      color: var(--text-muted);
      font-size: 1.6vh;
      margin: 0 0.1vw;
      cursor: pointer;
      transition: 0.2s;
      line-height: 1;
    }
    .metric-header .remote-inline .dot.active-dot {
      color: var(--text-primary);
      font-size: 2.2vh;
    }
    .metric-header .remote-inline .slide-counter {
      color: var(--text-muted);
      font-size: 1.6vh;
      font-weight: 400;
      margin: 0 0.1vw;
      letter-spacing: 0.3px;
    }
    .metric-header .remote-inline .admin-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6vh;
      cursor: pointer;
      padding: 0.1vh 0.3vw;
      border-radius: 30px;
      transition: 0.2s;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.2vw;
      border-left: 1px solid var(--badge-border);
      padding-left: 0.6vw;
      margin-left: 0.2vw;
    }
    .metric-header .remote-inline .admin-link:hover {
      color: #3b82f6;
      background: var(--badge-bg);
    }
    .metric-header .remote-inline .fullscreen-btn {
      font-size: 1.8vh;
      border-left: 1px solid var(--badge-border);
      padding-left: 0.6vw;
      margin-left: 0.2vw;
    }

    .card-row {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      min-height: 0;
    }

    .centre-card {
      flex: 1;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 2.8vh;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 1.5vh 2.5vw;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .centre-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 0.6vh;
      border-radius: 0 6px 6px 0;
      background: var(--brand-colour);
    }
    .centre-card.tp { --brand-colour: #3b82f6; }
    .centre-card.wns { --brand-colour: #f59e0b; }

    /* FIX: Chart area – better proportions for wide screens */
    .chart-area {
      flex: 0 0 30%;
      max-width: 30%;
      aspect-ratio: 1/1;
      max-height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chart-area canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .details-area {
      flex: 1;
      padding-left: 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.3vh;
    }
    .details-area .centre-name {
      font-size: 2.6vh;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.2vh;
      display: flex;
      align-items: center;
      gap: 0.6vw;
    }
    .details-area .centre-name .logo-icon {
      height: 4vh;
      width: auto;
      object-fit: contain;
    }

    .details-area .main-value {
      font-size: 8vh;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 1vw;
    }
    .details-area .main-value .trend {
      font-size: 3.2vh;
      font-weight: 600;
      margin-left: 0.2vw;
    }
    .trend.up { color: #10b981; }
    .trend.down { color: #ef4444; }
    .trend.flat { color: var(--text-muted); }

    .details-area .comparison-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      font-size: 2vh;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .details-area .comparison-row .prev-label {
      background: var(--badge-bg);
      padding: 0.2vh 0.8vw;
      border-radius: 30px;
      border: 1px solid var(--badge-border);
      font-size: 1.8vh;
    }
    .details-area .comparison-row .gap-label {
      font-weight: 500;
    }
    .details-area .comparison-row .gap-label.above { color: #10b981; }
    .details-area .comparison-row .gap-label.below { color: #f59e0b; }
    .details-area .comparison-row .gap-label.well-below { color: #ef4444; }

    .details-area .insight-row {
      display: flex;
      align-items: center;
      gap: 1vw;
      margin-top: 0.2vh;
      font-size: 2vh;
      font-weight: 500;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .details-area .insight-row .insight-badge {
      background: var(--badge-bg);
      padding: 0.2vh 0.8vw;
      border-radius: 30px;
      border: 1px solid var(--badge-border);
      font-size: 1.8vh;
      display: inline-flex;
      align-items: center;
      gap: 0.3vw;
    }
    .details-area .insight-row .insight-badge.improving { color: #10b981; border-color: #10b981; background: rgba(16,185,129,0.08); }
    .details-area .insight-row .insight-badge.declining { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,0.08); }
    .details-area .insight-row .insight-badge.steady { color: var(--text-muted); border-color: var(--badge-border); }

    .sparkline-container {
      width: 100%;
      height: 4vh;
      margin-top: 0.2vh;
    }
    .sparkline-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .details-area .target-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 0.4vh;
      font-size: 2.2vh;
      color: var(--text-secondary);
    }
    .details-area .target-row .target-badge {
      display: flex;
      align-items: center;
      gap: 0.4vw;
      background: var(--badge-bg);
      padding: 0.3vh 1.2vw;
      border-radius: 40px;
      border: 1px solid var(--badge-border);
    }
    .details-area .target-row .target-badge .t-icon {
      width: 1.8vh;
      height: 1.8vh;
      color: var(--text-muted);
    }
    .details-area .target-row .target-badge strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .summary-grid-vertical {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      width: 100%;
      height: 100%;
    }

    .summary-card-vertical {
      flex: 1;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 2.8vh;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      padding: 1.5vh 2vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .summary-card-vertical::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0.6vh;
      background: linear-gradient(90deg, #3b82f6, #f59e0b);
      opacity: 0.3;
    }

    .summary-card-vertical .metric-title {
      font-size: 2.8vh;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 0.8vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .summary-card-vertical .metric-title .unit {
      font-size: 1.8vh;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--badge-bg);
      padding: 0.1vh 1vw;
      border-radius: 40px;
      border: 1px solid var(--badge-border);
    }

    .summary-row-vertical {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6vh 0;
      border-bottom: 1px solid var(--badge-border);
      flex-shrink: 0;
    }
    .summary-row-vertical:last-child { border-bottom: none; }

    .summary-row-vertical .centre-info {
      display: flex;
      align-items: center;
      gap: 0.6vw;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 2vh;
      flex: 0 0 15%;
    }
    .summary-row-vertical .centre-info .dot {
      width: 1.4vh;
      height: 1.4vh;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .summary-row-vertical .values {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      flex: 1;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .summary-row-vertical .values .current {
      font-size: 2.8vh;
      font-weight: 700;
      color: var(--text-primary);
    }
    .summary-row-vertical .values .change {
      font-size: 2vh;
      font-weight: 500;
      min-width: 4.5vw;
    }
    .summary-row-vertical .values .change.up { color: #10b981; }
    .summary-row-vertical .values .change.down { color: #ef4444; }
    .summary-row-vertical .values .change.flat { color: var(--text-muted); }

    .summary-row-vertical .values .gap-badge {
      font-size: 1.8vh;
      padding: 0.2vh 1vw;
      border-radius: 30px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.2vw;
      white-space: nowrap;
    }
    .summary-row-vertical .values .gap-badge.above { color: #10b981; border-color: #10b981; background: rgba(16,185,129,0.08); }
    .summary-row-vertical .values .gap-badge.below { color: #f59e0b; border-color: #f59e0b; background: rgba(245,158,11,0.08); }
    .summary-row-vertical .values .gap-badge.well-below { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,0.08); }

    .summary-row-vertical .bar-container {
      flex: 0 0 15%;
      height: 0.8vh;
      background: var(--badge-bg);
      border-radius: 40px;
      overflow: hidden;
    }
    .summary-row-vertical .bar-container .bar-fill {
      height: 100%;
      border-radius: 40px;
      transition: width 0.6s ease;
    }

    #lastUpdatedFooter {
      position: fixed;
      bottom: 1.5vh;
      right: 2vw;
      font-size: 1.6vh;
      color: var(--text-muted);
      background: var(--remote-bg);
      backdrop-filter: blur(8px);
      padding: 0.4vh 1.2vw;
      border-radius: 40px;
      border: 1px solid var(--badge-border);
      box-shadow: var(--shadow);
      z-index: 998;
      opacity: 0.7;
      transition: opacity 0.3s;
      pointer-events: none;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    #lastUpdatedFooter:hover { opacity: 1; }

    @media (max-width: 768px) {
      body { padding-top: 12dvh; }
      .brand-bar { height: 12dvh; padding: 0 1.5vw; }
      .brand-bar .brand-left img { height: 80%; }
      .slide { padding: 1vh 2vw; }
      .centre-card { flex-direction: column; padding: 1.5vh; }
      .chart-area { flex: 0 0 40%; width: 40%; max-width: 40%; }
      .details-area { padding-left: 0; align-items: center; text-align: center; }
      .details-area .main-value { font-size: 5vh; flex-wrap: wrap; justify-content: center; }
      .metric-header h2 { font-size: 2.8vh; }
      .metric-header .remote-inline { padding: 0.2vh 1.5vw; gap: 1vw; flex-wrap: wrap; }
      .metric-header .remote-inline .admin-link { border-left: none; padding-left: 0; margin-left: 0; }
      .summary-row-vertical .values { gap: 0.8vw; }
      .summary-row-vertical .bar-container { display: none; }
      #lastUpdatedFooter { bottom: 1vh; right: 2vw; font-size: 1.4vh; padding: 0.2vh 1.5vw; }
    }

    /* Optional: large screen tweaks */
    @media (min-width: 1400px) {
      .centre-card { padding: 1.2vh 2vw; }
      .details-area .main-value { font-size: 7vh; }
      .chart-area { flex: 0 0 25%; max-width: 25%; }
    }

    @media print {
      body { padding-top: 0; }
      .brand-bar { display: none !important; }
      body { background: white !important; }
      .slide { opacity: 1 !important; position: relative !important; display: block !important; }
      .slide:not(.active) { display: none !important; }
      .remote-inline { display: none !important; }
      .centre-card, .summary-card-vertical { break-inside: avoid; }
      #lastUpdatedFooter { display: none !important; }
    }
  </style>
</head>
<body>

<!-- Brand Bar – Delta only -->
<div class="brand-bar">
  <div class="brand-left">
    <img src="assets/delta-logo.png" alt="Delta Airlines" onerror="this.style.display='none'" />
  </div>
</div>

<div class="slides" id="slidesContainer"></div>
<div id="lastUpdatedFooter">🕒 Loading...</div>

<script>
  // (JavaScript unchanged – the previous working version stays exactly the same)
  (async function() {
    const SLIDE_INTERVAL = 15000;
    let currentSlide = 0;
    let slidesData = [];
    let intervalId = null;
    let isPaused = false;
    let allData = null;

    function getStatusClass(value, target, isHigher) {
      if (isHigher) {
        if (value >= target) return 'on-target';
        if (value >= target * 0.9) return 'below-target';
        return 'well-below';
      } else {
        if (value <= target) return 'on-target';
        if (value <= target * 1.1) return 'below-target';
        return 'well-below';
      }
    }

    function getGapText(value, target, isHigher) {
      const diff = isHigher ? value - target : target - value;
      const gap = Math.abs(diff);
      if (isHigher) {
        if (diff >= 0) return `+${gap.toFixed(1)}`;
        return `${gap.toFixed(1)}`;
      } else {
        if (diff >= 0) return `${gap.toFixed(1)}`;
        return `+${gap.toFixed(1)}`;
      }
    }

    function getGapClass(value, target, isHigher) {
      if (isHigher) {
        if (value >= target) return 'above';
        if (value >= target * 0.9) return 'below';
        return 'well-below';
      } else {
        if (value <= target) return 'above';
        if (value <= target * 1.1) return 'below';
        return 'well-below';
      }
    }

    function getInsightText(current, previous, isHigher, unit) {
      const diff = current - previous;
      if (Math.abs(diff) < 0.01) {
        return `→ Steady at ${current}${unit}`;
      }
      const pctChange = (diff / Math.abs(previous)) * 100;
      const sign = diff > 0 ? '+' : '';
      const direction = diff > 0 ? (isHigher ? 'improving' : 'declining') : (isHigher ? 'declining' : 'improving');
      const emoji = diff > 0 ? '📈' : '📉';
      return `${emoji} ${direction} (${sign}${pctChange.toFixed(1)}%)`;
    }

    function updateTimestamp(data) {
      const el = document.getElementById('lastUpdatedFooter');
      if (!el) return;
      if (!data || !data.lastUpdated) {
        el.textContent = '🕒 Not yet updated';
        return;
      }
      try {
        const date = new Date(data.lastUpdated);
        const formatted = date.toLocaleString('en-ZA', {
          day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        const user = data.lastUpdatedBy || 'admin';
        el.textContent = `🕒 Updated: ${formatted} by ${user}`;
      } catch(e) {
        el.textContent = '🕒 Invalid timestamp';
      }
    }

    async function fetchData() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        if (!res.ok) throw new Error('Network error');
        allData = await res.json();
        return allData;
      } catch(e) {
        console.error('Fetch error:', e);
        return null;
      }
    }

    function buildSlides(data) {
      const container = document.getElementById('slidesContainer');
      container.innerHTML = '';
      slidesData = [];
      const targets = data.targets;
      const centres = data.centres;
      const metricKeys = ['SIS', 'IFSR', 'CHT', 'SUMMARY'];
      const metricLabels = { SIS: 'SIS', IFSR: 'IFSR', CHT: 'CHT', SUMMARY: 'Summary' };
      const metricUnits = { SIS: '%', IFSR: '%', CHT: 's', SUMMARY: '' };
      const higherIsBetter = { SIS: true, IFSR: true, CHT: false };

      const svgIcons = {
        SIS: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><path d="M9 13l3 3 3-3"/></svg>`,
        IFSR: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M12 2v4"/><path d="M12 22v-4"/><path d="M2 12h4"/><path d="M22 12h-4"/></svg>`,
        CHT: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
        SUMMARY: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`
      };

      function buildRemoteHTML(slideIndex, totalSlides) {
        let dotsHTML = '';
        for (let i = 0; i < totalSlides; i++) {
          dotsHTML += `<span class="dot ${i === slideIndex ? 'active-dot' : ''}" data-index="${i}">●</span>`;
        }
        return `
          <div class="remote-inline">
            <button class="prev-btn" title="Previous">‹</button>
            <button class="pause-btn" title="Pause/Play">⏸</button>
            <button class="next-btn" title="Next">›</button>
            <span class="slide-counter">${slideIndex+1} / ${totalSlides}</span>
            ${dotsHTML}
            <button class="fullscreen-btn" title="Toggle Fullscreen (F)">⛶</button>
            <button class="admin-link" title="Open Admin (keyboard: A)">⚙ Admin</button>
          </div>
        `;
      }

      for (let mi = 0; mi < 3; mi++) {
        const metricKey = metricKeys[mi];
        const slide = document.createElement('div');
        slide.className = 'slide' + (mi === 0 ? ' active' : '');
        slide.dataset.slideType = 'metric';

        const header = document.createElement('div');
        header.className = 'metric-header';
        header.innerHTML = `
          ${svgIcons[metricKey]}
          <h2>${metricLabels[metricKey]}</h2>
          <span class="unit-badge">${metricUnits[metricKey]}</span>
          <span class="status-badge" id="status-${metricKey}">—</span>
          ${buildRemoteHTML(mi, 4)}
        `;
        slide.appendChild(header);

        const cardRow = document.createElement('div');
        cardRow.className = 'card-row';

        centres.forEach((centre) => {
          const card = document.createElement('div');
          card.className = `centre-card ${centre.name.toLowerCase()}`;

          const chartArea = document.createElement('div');
          chartArea.className = 'chart-area';
          const canvas = document.createElement('canvas');
          canvas.id = `chart-${centre.name}-${metricKey}`;
          chartArea.appendChild(canvas);

          const details = document.createElement('div');
          details.className = 'details-area';
          const dotColour = centre.colour;
          let logoPath;
          if (centre.name === 'TP') {
            logoPath = 'assets/TP-logo.png';
          } else if (centre.name === 'WNS') {
            logoPath = 'assets/wns-logo.png';
          } else {
            logoPath = `assets/${centre.name.toLowerCase()}-logo.png`;
          }

          details.innerHTML = `
            <div class="centre-name">
              <img src="${logoPath}" alt="${centre.name} logo" class="logo-icon" onerror="this.style.display='none'" />
            </div>
            <div class="main-value">
              <span id="val-${centre.name}-${metricKey}">—</span>
              <span class="trend" id="trend-${centre.name}-${metricKey}"></span>
            </div>
            <div class="comparison-row">
              <span class="prev-label" id="prev-${centre.name}-${metricKey}">Prev: —</span>
              <span class="gap-label" id="gap-${centre.name}-${metricKey}">Gap: —</span>
            </div>
            <div class="insight-row">
              <span class="insight-badge" id="insight-${centre.name}-${metricKey}">—</span>
            </div>
            <div class="sparkline-container">
              <canvas id="spark-${centre.name}-${metricKey}"></canvas>
            </div>
            <div class="target-row">
              <span class="target-badge">
                <svg class="t-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                Target: <strong>${targets[metricKey]}${metricUnits[metricKey]}</strong>
              </span>
            </div>
          `;

          card.appendChild(chartArea);
          card.appendChild(details);
          cardRow.appendChild(card);

          slidesData.push({
            slideIndex: mi,
            centreName: centre.name,
            colour: centre.colour,
            metricKey,
            canvas,
            target: targets[metricKey],
            current: centre.metrics[metricKey].current,
            previous: centre.metrics[metricKey].previous,
            history: centre.metrics[metricKey].history || [],
            higherIsBetter: higherIsBetter[metricKey],
            unit: metricUnits[metricKey],
            valueEl: document.getElementById(`val-${centre.name}-${metricKey}`),
            trendEl: document.getElementById(`trend-${centre.name}-${metricKey}`),
            prevEl: document.getElementById(`prev-${centre.name}-${metricKey}`),
            gapEl: document.getElementById(`gap-${centre.name}-${metricKey}`),
            insightEl: document.getElementById(`insight-${centre.name}-${metricKey}`),
            sparkCanvas: document.getElementById(`spark-${centre.name}-${metricKey}`),
            statusBadge: document.getElementById(`status-${metricKey}`)
          });
        });

        slide.appendChild(cardRow);
        container.appendChild(slide);
      }

      const summarySlide = document.createElement('div');
      summarySlide.className = 'slide';
      summarySlide.dataset.slideType = 'summary';

      const summaryHeader = document.createElement('div');
      summaryHeader.className = 'metric-header';
      summaryHeader.innerHTML = `
        ${svgIcons.SUMMARY}
        <h2>Performance Summary</h2>
        ${buildRemoteHTML(3, 4)}
      `;
      summarySlide.appendChild(summaryHeader);

      const summaryGrid = document.createElement('div');
      summaryGrid.className = 'summary-grid-vertical';

      const metricKeysSummary = ['SIS', 'IFSR', 'CHT'];
      metricKeysSummary.forEach((metricKey) => {
        const card = document.createElement('div');
        card.className = 'summary-card-vertical';
        card.id = `summary-card-${metricKey}`;
        card.innerHTML = `
          <div class="metric-title">
            ${metricKey}
            <span class="unit">${metricUnits[metricKey]}</span>
          </div>
          <div id="summary-rows-${metricKey}"></div>
        `;
        summaryGrid.appendChild(card);
        slidesData.push({
          slideIndex: 3,
          metricKey,
          summaryContainer: document.getElementById(`summary-rows-${metricKey}`),
          target: targets[metricKey],
          higherIsBetter: higherIsBetter[metricKey],
          unit: metricUnits[metricKey]
        });
      });

      summarySlide.appendChild(summaryGrid);
      container.appendChild(summarySlide);

      updateTimestamp(data);
    }

    let chartInstances = {};

    function initCharts() {
      slidesData.forEach((item) => {
        if (item.slideIndex === 3) return;
        const ctx = item.canvas.getContext('2d');
        const current = item.current;
        const target = item.target;
        const isHigher = item.higherIsBetter;

        let met;
        if (isHigher) met = current >= target;
        else met = current <= target;

        let fillPercent;
        if (isHigher) {
          fillPercent = Math.min((current / target) * 100, 100);
        } else {
          if (current <= target) fillPercent = 100;
          else fillPercent = Math.min((target / current) * 100, 100);
        }

        const colour = met ? '#10b981' : '#f59e0b';

        const centreTextPlugin = {
          id: 'centreText',
          beforeDraw: function(chart) {
            const { width, height, ctx } = chart;
            ctx.save();
            const text = item.current + (item.unit === '%' ? '%' : '');
            const fontSize = Math.min(width, height) * 0.2;
            ctx.font = `700 ${fontSize}px Inter, -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#0b1a33';
            ctx.fillText(text, width / 2, height / 2);
            ctx.restore();
          }
        };

        const chart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            datasets: [{
              data: [fillPercent, 100 - fillPercent],
              backgroundColor: [colour, '#e9edf2'],
              borderWidth: 0,
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            cutout: '72%',
            plugins: { tooltip: { enabled: false }, legend: { display: false } },
            animation: { animateRotate: true, duration: 800 }
          },
          plugins: [centreTextPlugin]
        });
        chartInstances[`${item.centreName}-${item.metricKey}`] = chart;

        if (item.sparkCanvas && item.history && item.history.length > 1) {
          const sparkCtx = item.sparkCanvas.getContext('2d');
          new Chart(sparkCtx, {
            type: 'line',
            data: {
              labels: item.history.map((_, i) => i+1),
              datasets: [{
                data: item.history,
                borderColor: item.colour,
                borderWidth: 2,
                fill: false,
                tension: 0.2,
                pointRadius: 0,
                pointHoverRadius: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: { enabled: false } },
              scales: { x: { display: false }, y: { display: false } },
              animation: false
            }
          });
        }

        updateMetricText(item);
      });

      updateSummary();
    }

    function updateMetricText(item) {
      const displayVal = item.current + (item.unit === '%' ? '%' : '');
      if (item.valueEl) item.valueEl.textContent = displayVal;

      const prev = item.previous;
      const diff = item.current - prev;
      let trendText = '', trendClass = 'flat';
      if (Math.abs(diff) < 0.01) {
        trendText = '→ 0%';
      } else {
        const pctChange = (diff / Math.abs(prev)) * 100;
        const sign = diff > 0 ? '+' : '';
        trendText = `${sign}${pctChange.toFixed(1)}%`;
        if (item.higherIsBetter) trendClass = diff > 0 ? 'up' : 'down';
        else trendClass = diff < 0 ? 'up' : 'down';
      }
      if (item.trendEl) {
        item.trendEl.textContent = trendText;
        item.trendEl.className = `trend ${trendClass}`;
      }

      if (item.prevEl) {
        item.prevEl.textContent = `Prev: ${prev}${item.unit}`;
      }

      if (item.gapEl) {
        const gapText = getGapText(item.current, item.target, item.higherIsBetter);
        const gapClass = getGapClass(item.current, item.target, item.higherIsBetter);
        const unit = item.unit === '%' ? '%' : 's';
        item.gapEl.textContent = `${gapText}${unit}`;
        item.gapEl.className = `gap-label ${gapClass}`;
      }

      if (item.insightEl) {
        const insightText = getInsightText(item.current, item.previous, item.higherIsBetter, item.unit);
        item.insightEl.textContent = insightText;
        const diff = item.current - item.previous;
        if (Math.abs(diff) < 0.01) {
          item.insightEl.className = 'insight-badge steady';
        } else {
          const isImproving = (diff > 0 && item.higherIsBetter) || (diff < 0 && !item.higherIsBetter);
          item.insightEl.className = `insight-badge ${isImproving ? 'improving' : 'declining'}`;
        }
      }

      if (item.statusBadge) {
        const status = getStatusClass(item.current, item.target, item.higherIsBetter);
        let label = '';
        if (status === 'on-target') label = '✅ On Target';
        else if (status === 'below-target') label = '⚠️ Below Target';
        else label = '❌ Well Below';
        item.statusBadge.textContent = label;
        item.statusBadge.className = `status-badge ${status}`;
      }
    }

    function updateSummary() {
      const metricKeys = ['SIS', 'IFSR', 'CHT'];
      const centres = allData.centres;
      metricKeys.forEach((metricKey) => {
        const container = document.getElementById(`summary-rows-${metricKey}`);
        if (!container) return;
        const target = allData.targets[metricKey];
        const isHigher = metricKey !== 'CHT';
        const unit = metricKey === 'CHT' ? 's' : '%';

        const tpCentre = centres.find(c => c.name === 'TP');
        const wnsCentre = centres.find(c => c.name === 'WNS');
        if (!tpCentre || !wnsCentre) return;

        const tpData = tpCentre.metrics[metricKey];
        const wnsData = wnsCentre.metrics[metricKey];

        function buildRowHTML(centre, data) {
          const current = data.current;
          const prev = data.previous;
          const diff = current - prev;
          const pctChange = (Math.abs(prev) > 0) ? (diff / Math.abs(prev)) * 100 : 0;
          const sign = diff > 0 ? '+' : (diff < 0 ? '' : '');
          const changeText = (Math.abs(diff) < 0.01) ? '→ 0%' : `${sign}${pctChange.toFixed(1)}%`;
          const changeClass = (diff > 0) ? (isHigher ? 'up' : 'down') : (diff < 0 ? (isHigher ? 'down' : 'up') : 'flat');

          const gap = isHigher ? current - target : target - current;
          const gapAbs = Math.abs(gap);
          const gapText = (gap >= 0 ? '✅' : '⚠️') + ' ' + gapAbs.toFixed(1) + unit;
          const gapClass = getGapClass(current, target, isHigher);

          let barPercent = 0;
          if (isHigher) {
            barPercent = Math.min((current / target) * 100, 100);
          } else {
            if (current <= target) barPercent = 100;
            else barPercent = Math.min((target / current) * 100, 100);
          }
          const barColor = (gap >= 0) ? '#10b981' : (gapAbs / (isHigher ? target : target*1.5) > 0.15 ? '#ef4444' : '#f59e0b');

          return `
            <div class="summary-row-vertical">
              <span class="centre-info">
                <span class="dot" style="background:${centre.colour};"></span>
                ${centre.name}
              </span>
              <span class="values">
                <span class="current">${current}${unit}</span>
                <span class="change ${changeClass}">${changeText}</span>
                <span class="gap-badge ${gapClass}">${gapText}</span>
                <span class="bar-container">
                  <span class="bar-fill" style="width:${barPercent}%;background:${barColor};"></span>
                </span>
              </span>
            </div>
          `;
        }

        container.innerHTML = `
          ${buildRowHTML(tpCentre, tpData)}
          ${buildRowHTML(wnsCentre, wnsData)}
        `;
      });
    }

    async function refreshData() {
      const newData = await fetchData();
      if (!newData) return;
      allData = newData;
      updateTimestamp(allData);

      slidesData.forEach((item) => {
        if (item.slideIndex === 3) {
          item.target = allData.targets[item.metricKey];
          return;
        }
        const centre = allData.centres.find(c => c.name === item.centreName);
        if (!centre) return;
        const metric = centre.metrics[item.metricKey];
        if (!metric) return;
        item.current = metric.current;
        item.previous = metric.previous;
        item.history = metric.history || [];
        item.target = allData.targets[item.metricKey];

        const chart = chartInstances[`${item.centreName}-${item.metricKey}`];
        if (chart) {
          const isHigher = item.higherIsBetter;
          let met = isHigher ? item.current >= item.target : item.current <= item.target;
          let fillPercent;
          if (isHigher) {
            fillPercent = Math.min((item.current / item.target) * 100, 100);
          } else {
            if (item.current <= item.target) fillPercent = 100;
            else fillPercent = Math.min((item.target / item.current) * 100, 100);
          }
          const colour = met ? '#10b981' : '#f59e0b';
          chart.data.datasets[0].data = [fillPercent, 100 - fillPercent];
          chart.data.datasets[0].backgroundColor = [colour, '#e9edf2'];
          chart.update();
        }

        updateMetricText(item);

        if (item.sparkCanvas && item.history && item.history.length > 1) {
          const existing = Chart.getChart(item.sparkCanvas);
          if (existing) existing.destroy();
          const sparkCtx = item.sparkCanvas.getContext('2d');
          new Chart(sparkCtx, {
            type: 'line',
            data: {
              labels: item.history.map((_, i) => i+1),
              datasets: [{
                data: item.history,
                borderColor: item.colour,
                borderWidth: 2,
                fill: false,
                tension: 0.2,
                pointRadius: 0,
                pointHoverRadius: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: { enabled: false } },
              scales: { x: { display: false }, y: { display: false } },
              animation: false
            }
          });
        }
      });
      updateSummary();
    }

    function goToSlide(index) {
      const slides = document.querySelectorAll('.slide');
      if (index < 0) index = 0;
      if (index >= slides.length) index = slides.length - 1;
      currentSlide = index;
      slides.forEach((s, i) => s.classList.toggle('active', i === index));

      document.querySelectorAll('.remote-inline').forEach((remote, idx) => {
        const dots = remote.querySelectorAll('.dot');
        dots.forEach((d, i) => {
          d.classList.toggle('active-dot', i === index);
        });
        const counter = remote.querySelector('.slide-counter');
        if (counter) counter.textContent = `${index+1} / ${slides.length}`;
      });
    }

    function nextSlide() {
      const slides = document.querySelectorAll('.slide');
      goToSlide((currentSlide + 1) % slides.length);
    }
    function prevSlide() {
      const slides = document.querySelectorAll('.slide');
      goToSlide((currentSlide - 1 + slides.length) % slides.length);
    }

    function startAutoPlay() {
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(nextSlide, SLIDE_INTERVAL);
      isPaused = false;
      document.querySelectorAll('.pause-btn').forEach(btn => btn.textContent = '⏸');
    }
    function togglePause() {
      if (isPaused) { startAutoPlay(); }
      else { clearInterval(intervalId); intervalId = null; isPaused = true; document.querySelectorAll('.pause-btn').forEach(btn => btn.textContent = '▶'); }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Fullscreen request denied:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('button');
      if (!target) return;

      if (target.classList.contains('prev-btn')) {
        clearInterval(intervalId);
        prevSlide();
        startAutoPlay();
      }
      if (target.classList.contains('next-btn')) {
        clearInterval(intervalId);
        nextSlide();
        startAutoPlay();
      }
      if (target.classList.contains('pause-btn')) {
        togglePause();
      }
      if (target.classList.contains('admin-link')) {
        window.open('admin.html', '_blank');
      }
      if (target.classList.contains('fullscreen-btn')) {
        toggleFullscreen();
      }
      const dot = target.closest('.dot');
      if (dot && dot.dataset.index !== undefined) {
        clearInterval(intervalId);
        goToSlide(parseInt(dot.dataset.index));
        startAutoPlay();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); clearInterval(intervalId); nextSlide(); startAutoPlay(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); clearInterval(intervalId); prevSlide(); startAutoPlay(); }
      if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
      if (e.key === 'a' || e.key === 'A') { e.preventDefault(); window.open('admin.html', '_blank'); }
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
    });

    const initialData = await fetchData();
    if (!initialData) {
      document.body.innerHTML = `<div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#b91c1c;font-size:2.5rem;background:#f2f5f9;">⚠️ Could not load data.json</div>`;
      return;
    }
    allData = initialData;
    buildSlides(initialData);
    updateTimestamp(initialData);

    setTimeout(() => {
      initCharts();
      goToSlide(0);
      startAutoPlay();
      setInterval(refreshData, 60000);
    }, 100);
  })();
</script>
</body>
</html>
