<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TP vs WNS | Performance Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f5f9;
      background-image: radial-gradient(circle at 20% 30%, rgba(26, 115, 232, 0.03) 0%, transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(245, 124, 0, 0.03) 0%, transparent 60%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Slides container */
    .slides {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
      padding: 2vh 4vw;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Metric header */
    .metric-header {
      display: flex;
      align-items: center;
      gap: 1.2vw;
      margin-bottom: 2vh;
    }
    .metric-header .icon {
      font-size: 4vh;
    }
    .metric-header h2 {
      font-size: 5vh;
      font-weight: 700;
      color: #0b1a33;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .metric-header .badge {
      background: #e6edf5;
      padding: 0.3vh 1.2vw;
      border-radius: 40px;
      font-size: 2.2vh;
      font-weight: 600;
      color: #1e3a6b;
      margin-left: 0.5vw;
    }

    /* Row */
    .row {
      display: flex;
      flex-direction: row;
      width: 100%;
      max-width: 1400px;
      height: 65vh;
      gap: 3vw;
      justify-content: center;
      align-items: stretch;
    }

    .centre-card {
      flex: 1;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(2px);
      border-radius: 3.5vh;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vh 1.5vw;
      position: relative;
      transition: transform 0.2s;
      border: 1px solid rgba(255,255,255,0.5);
    }
    .centre-card:hover {
      transform: scale(1.01);
    }
    .centre-card .logo {
      font-size: 2.8vh;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.5vh;
      display: flex;
      align-items: center;
      gap: 0.6vw;
    }
    .centre-card .logo .dot {
      display: inline-block;
      width: 1.2vh;
      height: 1.2vh;
      border-radius: 50%;
    }

    .chart-container {
      position: relative;
      width: 65%;
      max-height: 45vh;
      aspect-ratio: 1/1;
      margin: 0.5vh 0;
    }
    .chart-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Overlay for centre value + trend */
    .centre-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 80%;
    }
    .centre-overlay .number {
      font-size: 7.5vh;
      font-weight: 800;
      line-height: 1;
      color: #0b1a33;
      letter-spacing: -0.02em;
    }
    .centre-overlay .trend {
      font-size: 2.8vh;
      font-weight: 600;
      margin-top: -0.2vh;
    }
    .trend.up { color: #10b981; }
    .trend.down { color: #ef4444; }
    .trend.flat { color: #94a3b8; }

    .target-info {
      margin-top: 1vh;
      font-size: 2.2vh;
      font-weight: 500;
      color: #475569;
      background: #f1f5f9;
      padding: 0.4vh 1.8vw;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.4vw;
    }
    .target-info strong {
      font-weight: 700;
      color: #0b1a33;
    }
    .target-info .target-icon {
      font-size: 1.8vh;
    }

    /* Footer / remote */
    .remote {
      position: fixed;
      bottom: 2.5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2vw;
      background: rgba(11, 26, 51, 0.7);
      backdrop-filter: blur(12px);
      padding: 0.6vh 2vw;
      border-radius: 60px;
      z-index: 999;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .remote button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 2.8vh;
      cursor: pointer;
      padding: 0.2vh 0.6vw;
      border-radius: 40px;
      transition: 0.2s;
      font-weight: 300;
      line-height: 1;
    }
    .remote button:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .remote .dot {
      color: rgba(255,255,255,0.3);
      font-size: 2.2vh;
      margin: 0 0.2vw;
      cursor: pointer;
      transition: 0.2s;
      line-height: 1;
    }
    .remote .dot.active-dot {
      color: #ffffff;
      font-size: 3vh;
    }
    .remote .pause-btn {
      font-size: 2.2vh;
      padding: 0.2vh 0.8vw;
    }
    .remote .slide-counter {
      color: rgba(255,255,255,0.5);
      font-size: 1.8vh;
      font-weight: 400;
      margin: 0 0.4vw;
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .row { flex-direction: column; height: auto; gap: 2vh; }
      .centre-card { height: 42vh; }
      .chart-container { width: 50%; max-height: 28vh; }
      .centre-overlay .number { font-size: 5vh; }
      .metric-header h2 { font-size: 3.5vh; }
    }
  </style>
</head>
<body>

<div class="slides" id="slidesContainer"></div>

<div class="remote" id="remoteControl">
  <button id="prevBtn" title="Previous">‹</button>
  <button id="pauseBtn" class="pause-btn" title="Pause/Play">⏸</button>
  <button id="nextBtn" title="Next">›</button>
  <span class="slide-counter" id="slideCounter">1 / 3</span>
  <span id="dotsContainer" style="display:flex;gap:0.3vw;align-items:center;"></span>
</div>

<script>
  (async function() {
    const SLIDE_INTERVAL = 15000;
    let currentSlide = 0;
    let slidesData = [];
    let intervalId = null;
    let isPaused = false;

    // Fetch data
    let data;
    try {
      const res = await fetch('data.json?t=' + Date.now());
      data = await res.json();
    } catch(e) {
      document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#b91c1c;font-size:2rem;">⚠️ Error loading data.json</div>';
      return;
    }

    const targets = data.targets;
    const centres = data.centres;
    const metricKeys = ['SIS', 'IFSR', 'CHT'];
    const metricLabels = {
      SIS: 'SIS',
      IFSR: 'IFSR',
      CHT: 'CHT'
    };
    const metricUnits = {
      SIS: '%',
      IFSR: '%',
      CHT: 's'
    };
    const higherIsBetter = { SIS: true, IFSR: true, CHT: false };

    const container = document.getElementById('slidesContainer');
    const dotsContainer = document.getElementById('dotsContainer');
    const slideCounter = document.getElementById('slideCounter');

    metricKeys.forEach((metricKey, slideIndex) => {
      const slide = document.createElement('div');
      slide.className = 'slide' + (slideIndex === 0 ? ' active' : '');
      slide.dataset.index = slideIndex;

      // Header
      const header = document.createElement('div');
      header.className = 'metric-header';
      header.innerHTML = `
        <span class="icon">${metricKey === 'SIS' ? '📊' : metricKey === 'IFSR' ? '🎯' : '⏱️'}</span>
        <h2>${metricLabels[metricKey]}</h2>
        <span class="badge">${metricUnits[metricKey]}</span>
      `;
      slide.appendChild(header);

      const row = document.createElement('div');
      row.className = 'row';

      centres.forEach((centre) => {
        const card = document.createElement('div');
        card.className = 'centre-card';

        // Logo / name
        const logo = document.createElement('div');
        logo.className = 'logo';
        logo.innerHTML = `<span class="dot" style="background:${centre.colour};"></span> ${centre.name}`;
        card.appendChild(logo);

        // Chart
        const chartWrapper = document.createElement('div');
        chartWrapper.className = 'chart-container';
        const canvas = document.createElement('canvas');
        canvas.id = `chart-${centre.name}-${metricKey}`;
        chartWrapper.appendChild(canvas);

        // Overlay
        const overlay = document.createElement('div');
        overlay.className = 'centre-overlay';
        overlay.id = `overlay-${centre.name}-${metricKey}`;
        overlay.innerHTML = `
          <span class="number">—</span>
          <span class="trend"></span>
        `;
        chartWrapper.appendChild(overlay);
        card.appendChild(chartWrapper);

        // Target info
        const targetVal = targets[metricKey];
        const targetInfo = document.createElement('div');
        targetInfo.className = 'target-info';
        targetInfo.innerHTML = `
          <span class="target-icon">🎯</span>
          Target: <strong>${targetVal}${metricUnits[metricKey]}</strong>
        `;
        card.appendChild(targetInfo);

        row.appendChild(card);

        slidesData.push({
          slideIndex,
          centreName: centre.name,
          colour: centre.colour,
          metricKey,
          canvas,
          overlay,
          target: targetVal,
          current: centre.metrics[metricKey].current,
          previous: centre.metrics[metricKey].previous,
          higherIsBetter: higherIsBetter[metricKey],
          unit: metricUnits[metricKey]
        });
      });

      slide.appendChild(row);
      container.appendChild(slide);

      // Dot
      const dot = document.createElement('span');
      dot.className = 'dot' + (slideIndex === 0 ? ' active-dot' : '');
      dot.textContent = '●';
      dot.dataset.index = slideIndex;
      dot.style.cursor = 'pointer';
      dot.addEventListener('click', () => goToSlide(slideIndex));
      dotsContainer.appendChild(dot);
    });

    // --- Chart initialisation ---
    const charts = [];
    slidesData.forEach((item) => {
      const ctx = item.canvas.getContext('2d');
      const current = item.current;
      const target = item.target;
      const isHigher = item.higherIsBetter;

      let met;
      if (isHigher) {
        met = current >= target;
      } else {
        met = current <= target;
      }

      let fillPercent;
      if (isHigher) {
        fillPercent = Math.min((current / target) * 100, 100);
      } else {
        if (current <= target) {
          fillPercent = 100;
        } else {
          fillPercent = Math.min((target / current) * 100, 100);
        }
      }

      const colour = met ? '#10b981' : '#f59e0b';

      const chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [fillPercent, 100 - fillPercent],
            backgroundColor: [colour, '#e9edf2'],
            borderWidth: 0,
            borderRadius: 8,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '70%',
          plugins: {
            tooltip: { enabled: false },
            legend: { display: false }
          },
          animation: {
            animateRotate: true,
            duration: 800
          }
        }
      });
      charts.push(chart);
      item.chart = chart;

      // Update overlay
      const overlay = item.overlay;
      const numEl = overlay.querySelector('.number');
      const trendEl = overlay.querySelector('.trend');

      let displayValue = current + (item.unit === '%' ? '%' : '');
      numEl.textContent = displayValue;

      // Trend
      const prev = item.previous;
      const diff = current - prev;
      let trendText = '';
      let trendClass = 'flat';
      if (Math.abs(diff) < 0.01) {
        trendText = '→ 0%';
        trendClass = 'flat';
      } else {
        const pctChange = (diff / Math.abs(prev)) * 100;
        const sign = diff > 0 ? '+' : '';
        trendText = `${sign}${pctChange.toFixed(1)}%`;
        if (isHigher) {
          trendClass = diff > 0 ? 'up' : 'down';
        } else {
          trendClass = diff < 0 ? 'up' : 'down';
        }
      }
      trendEl.textContent = trendText;
      trendEl.className = `trend ${trendClass}`;
    });

    // --- Navigation ---
    function goToSlide(index) {
      if (index < 0) index = 0;
      if (index >= metricKeys.length) index = metricKeys.length - 1;
      currentSlide = index;
      document.querySelectorAll('.slide').forEach((s, i) => {
        s.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active-dot', i === index);
      });
      slideCounter.textContent = `${index+1} / ${metricKeys.length}`;
    }

    function nextSlide() {
      const next = (currentSlide + 1) % metricKeys.length;
      goToSlide(next);
    }

    function prevSlide() {
      const prev = (currentSlide - 1 + metricKeys.length) % metricKeys.length;
      goToSlide(prev);
    }

    function startAutoPlay() {
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(nextSlide, SLIDE_INTERVAL);
      isPaused = false;
      document.getElementById('pauseBtn').textContent = '⏸';
    }

    function togglePause() {
      if (isPaused) {
        startAutoPlay();
      } else {
        clearInterval(intervalId);
        intervalId = null;
        isPaused = true;
        document.getElementById('pauseBtn').textContent = '▶';
      }
    }

    document.getElementById('nextBtn').addEventListener('click', () => { clearInterval(intervalId); nextSlide(); startAutoPlay(); });
    document.getElementById('prevBtn').addEventListener('click', () => { clearInterval(intervalId); prevSlide(); startAutoPlay(); });
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); clearInterval(intervalId); nextSlide(); startAutoPlay(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); clearInterval(intervalId); prevSlide(); startAutoPlay(); }
      if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
    });

    goToSlide(0);
    startAutoPlay();

    window.addEventListener('resize', () => {
      charts.forEach(ch => ch.resize());
    });
  })();
</script>
</body>
</html>
